workflows:
  android-release:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: 3.19.6
    scripts:
      - name: Build APK
        script: |
          if [ -d "study_tracker_flutter" ]; then
            cd study_tracker_flutter
          fi
          sed -i '' 's/intl: ^0.19.0/intl: ^0.18.1/g' pubspec.yaml 2>/dev/null || sed -i 's/intl: ^0.19.0/intl: ^0.18.1/g' pubspec.yaml
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - "/build//outputs/**/*.apk"
    publishing:
      email:
        recipients:
          - amosaeed34@gmail.com
        notify:
          success: true
          failure: false
