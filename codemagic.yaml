workflows:
  android-release:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: 3.19.6
    scripts:
      - name: Build APK
        script: |
          flutter packages get
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build//outputs//*.apk
    publishing:
      email:
        recipients:
          - amosaeed34@gmail.com
        notify:
          success: true
          failure: false
