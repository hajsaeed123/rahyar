name: rahyar_study_tracker
description: "A comprehensive offline study tracker mobile app"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  shamsi_date: ^1.0.4
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  fl_chart: ^0.68.0
  image_picker: ^1.1.2
  record: ^5.1.2
  audioplayers: ^6.0.0
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  flutter_staggered_animations: ^1.1.1
  share_plus: ^9.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
